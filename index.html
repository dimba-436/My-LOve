<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special ❤️</title>
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .heart {
            position: absolute; color: #ff4d6d; font-size: 20px;
            top: -10%; user-select: none;
            animation: fall linear infinite;
        }

        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        .card {
            background: white;
            padding: 80px 30px 40px 30px;
            border-radius: 40px; 
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            text-align: center;
            max-width: 350px; width: 85%;
            border: 2px solid #ff4d6d;
            position: relative;
        }

        /* Perfect Round Frame - No Text */
        .photo-container {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 5px solid #ff4d6d;
            position: absolute;
            top: -75px; left: 50%;
            transform: translateX(-50%);
            background: #fff;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3);
        }

        .photo-container img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        h1 { color: #ff4d6d; font-size: 22px; margin-top: 20px; }
        p { color: #555; font-size: 16px; font-style: italic; line-height: 1.5; }

        .btn {
            background-color: #ff4d6d; color: white; border: none;
            padding: 12px 25px; border-radius: 30px;
            cursor: pointer; margin-top: 20px; font-weight: 600;
        }

        #hidden-msg {
            display: none; margin-top: 20px;
            color: #ff4d6d; font-weight: bold; font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <div class="card">
        <div class="photo-container">
            <img src="image/IMG_2040.png" alt="My Love">
        </div>
        
        <h1>Tum Mere Liye Bahut Khaas Ho! ❤️</h1>
        <p>"Jab se tum meri zindagi mein aayi ho,<br>har din ek khoobsurat sapna lagta hai."</p>

        <button class="btn" onclick="show()">Click for a Surprise ✨</button>
        <div id="hidden-msg">Hamesha mere saath rehna! 💍</div>
    </div>

    <script>
        function createHearts() {
            const container = document.getElementById('heart-container');
            const hearts = ['❤️', '💖', '💗', '✨'];
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHearts, 400);

        function show() {
            document.getElementById('hidden-msg').style.display = 'block';
            document.querySelector('.btn').style.display = 'none';
        }
    </script>
</body>
</html>
